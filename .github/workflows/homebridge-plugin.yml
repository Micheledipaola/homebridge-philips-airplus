name: Homebridge plugin

on:
  push:
    paths: ['src/**', 'test/**', 'homebridge-ui/**', 'bin/**', 'package*.json', 'config.schema.json', 'custom_components/philips_airplus/models.yaml', '.github/workflows/homebridge-plugin.yml']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
