name: Publish to npm

# Runs when a GitHub release is published. Needs the repository secret
# NPM_TOKEN (an npm "granular access token" with read and write access).
on:
  release:
    types: [published]
  workflow_dispatch:   # "Run workflow" button in the Actions tab: publishes the version in package.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag#.}"   # accepts 0.3.0, v0.3.0 and v.0.3.0
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
